<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ishchilar Ro'yxati</title>
    <style>
        /* styles.css */

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: #fff;
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 80%;
            max-width: 800px;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        thead tr {
            background-color: #007BFF;
            color: #fff;
        }

        th, td {
            padding: 10px;
            text-align: left;
            border: 1px solid #ddd;
        }

        tbody tr:nth-child(odd) {
            background-color: #f9f9f9;
        }

        tbody tr:hover {
            background-color: #f1f1f1;
        }

        .delete-btn {
            background-color: #FF4C4C;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 14px;
        }

        .delete-btn:hover {
            background-color: #e60000;
        }

        .custom-button {
            display: inline-block;
            padding: 10px 20px;
            background-color: #007bff; /* Tugma rangi */
            color: #fff; /* Matn rangi */
            text-align: center;
            text-decoration: none;
            border-radius: 5px; /* Burchaklarni yumaloqlash */
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .custom-button:hover {
            background-color: #0056b3; /* Hover paytidagi rang */
        }


    </style>
</head>
<body>
<div class="container">
    <h1>Ishchilar Ro'yxati</h1>
    <!-- Ishchilar ro'yxati jadvali -->
    <table>
        <thead>
        <tr>
            <th>Ism</th>
            <th>Telefon</th>
            <th>Maosh</th>
        </tr>
        </thead>
        <tbody>
        <!-- Foydalanuvchilar ro'yxati (Backenddan keladi) -->
        {% for operator in operators %}
            <tr>
                <td>{{ operator.fullname }}</td>
                <td>{{ operator.phone_number }}</td>
                <td>{{ operator.salary }}</td>
                <td>
                    <form action="{% url 'delete' pk=operator.id %}" method="GET">
                        <button type="submit" class="delete-btn">Delete</button>
                    </form>
                </td>

                {#                <td>#}
                {#                    <button class="delete-btn" onclick="deleteWorker(1)">O'chirish</button>#}
                {#                </td>#}
            </tr>

        {% endfor %}
        <!-- Yana ishchilarni qo'shish mumkin -->
        </tbody>
    </table>
    <br>
    <a href="{% url 'home' %}" class="custom-button">Ishchi qo'shish</a>

</div>

<script>
    // Ishchini o'chirish funksiyasi
    function deleteWorker(workerId) {
        const confirmation = confirm("Haqiqatan ham o'chirishni xohlaysizmi?");
        if (confirmation) {
            alert(`Ishchi ID: ${workerId} o'chirildi.`);
            // Backend API orqali ishchini o'chirish (AJAX yoki form-submit yordamida)
        }
    }
</script>
</body>
</html>
