upstream django {
    server web:8000;  # 'web' konteyneriga ulanish
}

server {
    listen 80;

    location / {
        proxy_pass http://django;  # So'rovni 'django' upstreamga yuborish
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
