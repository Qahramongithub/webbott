events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name 127.0.0.1;  # yoki localhost

        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_connect_timeout 120s;
            proxy_http_version 1.1;
        }

        location /static/ {
            alias C:/Users/User/gitingnone/pythonProject1/webbot/static/;  # to'liq yo'l
        }

        location /media/ {
            alias C:/Users/User/gitingnone/pythonProject1/webbot/media;  # to'liq yo'l
        }

        error_page 404 /404.html;
        location = /404.html {
            root /path/to/your/error/pages/;
            internal;
        }

    }
}
